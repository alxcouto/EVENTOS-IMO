<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveSpeech MLX Live Player</title>
    <link rel="stylesheet" href="style.css?v=2">
    <!-- Supabase JS Client v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="app-container">
        <!-- Main Video & Subtitle Section (Unified Stage Container) -->
        <main class="main-content">
            <!-- Player Navigation Header (Scaled in lockstep with player) -->
            <header class="player-nav-bar">
                <div class="player-nav-left">
                    <a href="/26-09-30_BeLight/" class="btn-player-back" title="Volver a Be-Light 2026">
                        <span class="back-arrow">←</span>
                        <span>Be-Light 2026</span>
                    </a>
                    <span class="player-nav-divider">|</span>
                    <span class="player-nav-title">IMO Grupo Miranza</span>
                </div>
                <div class="player-nav-center">
                    <div class="session-nav-pills" id="player-session-pills">
                        <a href="?session=session_1" class="session-pill" id="pill-session_1">Sesión 1</a>
                        <a href="?session=session_2" class="session-pill" id="pill-session_2">Sesión 2</a>
                    </div>
                </div>
                <div class="player-nav-right">
                    <button id="btn-theme-toggle" class="btn-theme-toggle" type="button" title="Alternar modo claro / oscuro" aria-label="Cambiar tema">
                        <span class="theme-icon" id="theme-icon">☀️</span>
                        <span class="theme-text" id="theme-text">CLARO</span>
                    </button>
                </div>
            </header>

            <!-- 1. YouTube Player Area with Option B Custom Controls & Shields -->
            <section class="player-section">
                <div class="player-wrapper" id="player-wrapper">
                    <div class="video-responsive">
                        <div id="player"></div>
                    </div>

                    <!-- Poster Fallback Layer (shown before play and as fallback on errors/restrictions) -->
                    <div id="poster-layer" class="poster-layer">
                        <img id="poster-img" class="poster-img" alt="Session Poster" src="" />
                        <div class="poster-overlay-gradient"></div>
                        <div class="poster-content">
                            <div class="poster-status-badge">
                                <span class="pulse-dot"></span>
                                <span id="poster-status-text">EMISIÓN EN DIRECTO</span>
                            </div>
                            <button id="btn-poster-play" class="btn-poster-action" aria-label="Reproducir emisión">
                                <span class="play-icon">▶</span>
                                <span class="play-text">REPRODUCIR</span>
                            </button>
                            <div id="poster-error-notice" class="poster-error-notice hidden">
                                <span class="warning-icon">⚠️</span>
                                <span id="poster-error-msg">Emisión protegida o aún no iniciada en reproductor externo.</span>
                                <a id="poster-yt-link" href="#" target="_blank" class="btn-yt-external">
                                    Ver en YouTube ↗
                                </a>
                            </div>
                        </div>
                    </div>

                    <!-- Option B Transparent Pointer Shields: Full-surface shield blocks native YouTube CC & UI interactions -->
                    <div class="yt-shield-full" id="yt-shield-full" title="Live Video Player"></div>
                    <div class="yt-shield-top" title="Live Player"></div>
                    <div class="yt-shield-bottom-right" title="Live Player"></div>

                    <!-- Option C Central Unmute Overlay (Instagram/TikTok style) -->
                    <div id="unmute-overlay" class="unmute-overlay faded">
                        <button id="btn-unmute-overlay" class="btn-unmute-overlay" aria-label="Tap for sound">
                            <span class="unmute-icon">🔊</span>
                            <span class="unmute-text">TAP FOR SOUND</span>
                        </button>
                    </div>
                </div>

                <!-- Custom HTML5 Video Player Controls Bar -->
                <div class="custom-player-controls" id="custom-player-controls">
                    <!-- Subtle Timeline Scrubber Track (3px hairline, non-intrusive) -->
                    <div class="timeline-container" id="timeline-container" title="Control de tiempo">
                        <input type="range" id="input-custom-seek" class="ctrl-seek-bar" min="0" max="100" value="0" step="0.1" title="Time scrubber" aria-label="Control de tiempo">
                        <div class="seek-fill" id="seek-fill"></div>
                    </div>

                    <div class="ctrl-row">
                        <div class="ctrl-group left">
                            <button id="btn-custom-play" class="btn-ctrl" title="Play / Pause Video">
                                ▶ PLAY
                            </button>
                            <button id="btn-custom-mute" class="btn-ctrl" title="Mute / Unmute Video">
                                🔊 MUTE
                            </button>
                            <input type="range" id="input-custom-volume" min="0" max="100" value="100" class="ctrl-slider" title="Volume Slider">
                        </div>

                        <div class="ctrl-group center">
                            <button id="badge-live-status" class="badge-live" type="button" title="Live stream status">🔴 LIVE</button>
                            <span id="display-player-time" class="time-display">00:00</span>
                        </div>

                        <div class="ctrl-group right">
                            <button id="btn-custom-fs" class="btn-ctrl" title="Toggle Fullscreen">
                                ⛶
                            </button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 2. Subtitle Controls & Status Area -->
            <section class="controls-section">
                <div class="control-buttons-group">
                    <button id="btn-toggle-subtitles" class="btn-mode active" title="Toggle Subtitles Overlay">
                        <span class="btn-icon">👁️</span> SUBTITLES: <span id="subtitles-state-text">ON</span>
                    </button>
                    <button id="btn-tts" class="btn-tts" title="Toggle Speech Synthesis reading (mutes video audio)">
                        <span class="btn-icon">🔊</span> READ: <span id="tts-state-text">OFF</span>
                    </button>

                    <!-- Dynamic AI Subtitle Disclaimer (Swaps EN/ES dynamically) -->
                    <span id="ai-disclaimer" class="ai-disclaimer" title="AI Subtitles Notice">
                        <span class="warning-icon">⚠️</span>
                        <span id="ai-disclaimer-text">Los subtítulos generados por IA pueden contener imprecisiones</span>
                    </span>
                </div>

                <div class="language-status-group">
                    <div class="language-selector-wrapper">
                        <label for="select-language">Language:</label>
                        <select id="select-language" class="language-dropdown">
                            <option value="Spanish" selected>🇪🇸 Spanish (Español)</option>
                            <option value="English">🇬🇧 English</option>
                        </select>
                    </div>
                    <div class="status-indicator-wrapper">
                        <span id="info-tag" class="info-tag badge-original">Original</span>
                        <span id="waiting-tag" class="waiting-tag">Waiting ...</span>
                    </div>
                </div>
            </section>

            <!-- 3. Subtitle Display Box (Clean 2-line display) -->
            <section class="subtitle-section">
                <div class="subtitle-box" id="subtitle-box">
                    <div class="subtitle-text-wrapper">
                        <div class="subtitle-text" id="subtitle-text">
                            WAITING FOR LIVE SUBTITLES...
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Application Logic (loaded first to define onYouTubeIframeAPIReady callback) -->
    <script src="script.js?v=2"></script>
    <!-- YouTube IFrame Player API -->
    <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
